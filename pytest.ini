[pytest]
# La suite reale e' in tests/. Gli script CLI alla radice (test_build_system.py,
# test_run.py) e gli esperimenti in scratch/ sono nominati test_*.py ma NON sono
# test pytest: limitando la discovery a tests/ evitiamo che `python -m pytest`
# li raccolga (e i relativi errori "fixture not found" / side-effect).
# Per eseguirli a mano: `python test_build_system.py <game>` ecc.
testpaths = tests

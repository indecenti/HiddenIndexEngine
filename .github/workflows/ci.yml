name: CI

# Build + audit + test su Windows.
#
# Gira ad ogni push / PR. Verifica che:
#   1. requirements.txt sia installabile clean.
#   2. Gli audit del catalogo girino (informativo, non blocca).
#   3. I test pytest passino (unit + smoke).
#   4. La build PyInstaller produca un EXE valido.
#   5. Il bundle prodotto superi lo smoke test (struttura).
#
# Non lancia l'EXE in CI (pygame su runner headless ha problemi noti SDL);
# il launch test gira solo in locale con SMOKE_LAUNCH=1.

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  test:
    name: Test (Windows · Python 3.12)
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dipendenze runtime + dev
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Verifica pyinstaller_common (self-test)
        run: python editor/pyinstaller_common.py

      - name: Audit catalogo (informativo)
        # Continue-on-error: errori bloccanti nell'audit (ID dup, PNG mancanti)
        # NON devono fermare la CI finché non li abbiamo risolti. Quando li
        # avremo a zero, togliere continue-on-error.
        continue-on-error: true
        run: python tools/audit_catalog.py

      - name: Run pytest
        run: pytest -v tests/

  build:
    name: Build EXE (Windows)
    runs-on: windows-latest
    needs: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dipendenze
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Build editor (HiddenEditor.spec)
        run: pyinstaller HiddenEditor.spec --noconfirm
        timeout-minutes: 20

      - name: Post-build — copia engine sources + cartelle scrivibili
        # build_editor.py fa già questo step in GUI; qui lo replichiamo CLI.
        shell: pwsh
        run: |
          $dist = "dist/HiddenEditor"
          if (-not (Test-Path $dist)) { throw "$dist non creata da PyInstaller" }
          Copy-Item -Recurse -Force engine "$dist/engine"
          if (Test-Path main.py) { Copy-Item main.py "$dist/main.py" }
          if (Test-Path config.ini) { Copy-Item config.ini "$dist/config.ini" }
          New-Item -ItemType Directory -Force "$dist/games" | Out-Null
          New-Item -ItemType Directory -Force "$dist/saves" | Out-Null

      - name: Smoke test EXE (struttura)
        run: pytest -v tests/test_built_exe.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: HiddenEditor-windows
          path: dist/HiddenEditor/
          retention-days: 14

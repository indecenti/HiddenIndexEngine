name: Bug report
description: Report a malfunction in the game or the editor
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        For security vulnerabilities do NOT use this template:
        see [SECURITY.md](../blob/main/SECURITY.md).

  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happens and what you expected to happen.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: How to reproduce
      description: Exact steps, including the command you ran.
      placeholder: |
        1. python main.py --game Malonno_Survivors --lang en
        2. Open the Formis scene
        3. Click on ...
    validations:
      required: true

  - type: textarea
    id: traceback
    attributes:
      label: Traceback / log
      description: Paste the full text, not a screenshot.
      render: text
    validations:
      required: false

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Engine (game runtime)
        - Editor
        - Web export
        - Android build
        - Desktop / EXE build
        - Minigames
        - Other / not sure
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: Environment
      description: Operating system, Python version, HIE version (VERSION file).
      placeholder: "Windows 11, Python 3.12.4, HIE 0.1.0"
    validations:
      required: true

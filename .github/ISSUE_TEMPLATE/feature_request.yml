name: Feature request
description: Propose a new feature or an improvement
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Which concrete problem does it solve? Avoid starting from the solution.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: How you imagine it working.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
    validations:
      required: false

  - type: checkboxes
    id: impact
    attributes:
      label: Impact
      options:
        - label: Touches the engine, so it must be replicated in the web runtime (see docs/web/WEB_EXPORT_SYNC.md)
        - label: Requires a new dependency
        - label: Changes the format of scene.json or of the catalogs
